<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="title desc">
  <title id="title">Plan illustratif du site — entrée, salle et sortie</title>
  <desc id="desc">Bâtiment fictif avec accueil à gauche, salle polyvalente au centre, locaux annexes à droite et couloir en bas. Trois repères fixes indiquent des emplacements proposés de caméras. Aucune position de personne ni donnée en temps réel.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dce5eb" stroke-width=".6"/></pattern>
    <g id="camera"><circle r="19" fill="#186b82" stroke="white" stroke-width="3"/><rect x="-9" y="-6" width="12" height="11" rx="2" fill="white"/><path d="M4-3L10-7V7L4 3Z" fill="white"/></g>
  </defs>
  <rect width="900" height="510" rx="16" fill="#f3f6f8"/>
  <rect width="900" height="510" rx="16" fill="url(#grid)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="38" y="38" font-size="12" font-weight="700" letter-spacing="2" fill="#526b78">NIIFYÉÉN / PLAN DU SITE</text>
    <text x="862" y="38" text-anchor="end" font-size="12" fill="#526b78">NIVEAU 0 · SCHÉMA ILLUSTRATIF</text>
    <rect x="50" y="72" width="800" height="342" rx="8" fill="#fff" stroke="#d5dfe6" stroke-width="12"/>
    <path d="M56 78H268V315H56Z" fill="#e9f3f3"/>
    <path d="M274 78H618V315H274Z" fill="#edf2fb"/>
    <path d="M624 78H844V193H624Z" fill="#f2f0eb"/>
    <path d="M624 199H844V315H624Z" fill="#eef1f4"/>
    <path d="M56 321H844V408H56Z" fill="#fcf5e6"/>
    <!-- Walls leave real openings between the illustrative rooms and corridor. -->
    <g fill="none" stroke="#455c6b" stroke-width="6" stroke-linecap="square">
      <path d="M50 365V72H850V340M50 400V414H850V384"/>
      <path d="M271 72V318M621 72V318M621 196H850"/>
      <path d="M50 318H147M195 318H418M474 318H703M751 318H850"/>
    </g>
    <g fill="none" stroke="#8da3af" stroke-width="1.5">
      <path d="M147 318V270A48 48 0 0 1 195 318M418 318V262A56 56 0 0 1 474 318M703 318V270A48 48 0 0 1 751 318"/>
    </g>
    <!-- Furniture provides spatial landmarks without implying measured dimensions. -->
    <rect x="92" y="198" width="130" height="34" rx="6" fill="#d2e3e5" stroke="#a8c4c9"/>
    <rect x="105" y="252" width="31" height="25" rx="5" fill="#cadadd"/>
    <rect x="154" y="252" width="31" height="25" rx="5" fill="#cadadd"/>
    <rect x="359" y="172" width="170" height="78" rx="14" fill="#dce5f5" stroke="#afc1dd"/>
    <g fill="#c2d0e5"><rect x="381" y="151" width="29" height="13" rx="4"/><rect x="449" y="151" width="29" height="13" rx="4"/><rect x="381" y="258" width="29" height="13" rx="4"/><rect x="449" y="258" width="29" height="13" rx="4"/></g>
    <g fill="#d8d5cd"><rect x="660" y="131" width="65" height="32" rx="4"/><rect x="756" y="131" width="49" height="32" rx="4"/></g>
    <g fill="#d4dde4"><rect x="660" y="240" width="40" height="44" rx="3"/><rect x="712" y="240" width="40" height="44" rx="3"/><rect x="764" y="240" width="40" height="44" rx="3"/></g>
    <g fill="#304e60" text-anchor="middle" font-weight="600">
      <text x="159" y="132" font-size="20">Accueil</text><text x="445" y="124" font-size="20">Salle polyvalente</text>
      <text x="735" y="110" font-size="15">Bureau</text><text x="735" y="225" font-size="15">Local technique</text>
      <text x="445" y="372" font-size="17" fill="#887044">Couloir de circulation</text>
    </g>
    <g><use href="#camera" x="95" y="365"/><use href="#camera" x="570" y="155"/><use href="#camera" x="800" y="365"/></g>
    <g font-size="12" fill="#186b82" font-weight="700">
      <text x="124" y="370">01 · ENTRÉE</text><text x="570" y="190" text-anchor="middle">02 · SALLE</text><text x="770" y="370" text-anchor="end">03 · SORTIE</text>
    </g>
    <path d="M24 380H68M59 374L68 380L59 386M830 363H875M866 357L875 363L866 369" fill="none" stroke="#af8943" stroke-width="2"/>
    <text x="38" y="463" font-size="12" fill="#526b78">● Emplacement proposé de caméra</text>
    <text x="862" y="463" text-anchor="end" font-size="12" fill="#526b78">Sans échelle · À adapter au bâtiment réel</text>
  </g>
</svg>
