<!doctype html>
<html lang="fr" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NiifYéén — Rapports</title>
<script>
  try { var t = JSON.parse(localStorage.getItem("niifyeen.theme")); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="app-body">
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="page">
    <header class="toolbar">
      <h1>Rapports</h1>
      <a class="btn small primary" id="pdf" href="#" download>Télécharger (PDF)</a>
    </header>
    <div class="page-body">
      <p class="notice">Rapports <b>anonymes</b> : totaux et incidents techniques, sans nom, fiche ni image. Les rapports d'enquête nominatifs se font depuis la page Investigation.</p>
      <div class="alerts-grid">
        <div>
          <section class="card pad">
            <h2 id="pvTitle">Aperçu</h2>
            <p class="muted" id="pvSub"></p>
            <div id="preview"></div>
          </section>
        </div>
        <aside>
          <section class="card pad">
            <h2>Paramètres</h2>
            <div class="field"><label for="title">Titre</label><input id="title" type="text" maxlength="100" placeholder="Rapport d'activité"></div>
            <div class="field"><label for="period">Période</label>
              <select id="period"><option value="60">Dernière heure</option><option value="1440" selected>Dernières 24 h</option><option value="10080">7 derniers jours</option><option value="43200">30 derniers jours</option></select></div>
            <div class="field"><label for="camera">Caméra</label><select id="camera"><option value="">Toutes les caméras</option></select></div>
            <h3 class="section-title">Sections</h3>
            <div id="sections"></div>
          </section>
          <section class="card pad">
            <h2>Modèles</h2>
            <div class="field"><label for="tplSel">Modèle enregistré</label><select id="tplSel"><option value="">—</option></select></div>
            <div class="replay-row"><button class="btn small" id="tplLoad" type="button">Appliquer</button><button class="btn small danger" id="tplDelete" type="button">Supprimer</button></div>
            <div class="field"><label for="tplName">Enregistrer les paramètres actuels sous</label><input id="tplName" type="text" maxlength="40" placeholder="Nom du modèle"></div>
            <button class="btn small primary" id="tplSave" type="button">Enregistrer le modèle</button>
          </section>
        </aside>
      </div>
    </div>
  </main>
</div>
<script src="/static/shell.js"></script>
<script src="/static/statistics-logic.js"></script>
<script src="/static/reports.js"></script>
</body></html>
